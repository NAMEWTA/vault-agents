name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: vault-agents-server-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: vault-agents-server-win32-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: vault-agents-server-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: vault-agents-server-darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build PTY server
        working-directory: rust-servers
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}
        env:
          TERMINAL_SERVER_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          bin="rust-servers/target/${{ matrix.target }}/release/vault-agents-server"
          if [[ "${{ matrix.asset }}" == *.exe ]]; then
            bin="${bin}.exe"
          fi
          cp "$bin" "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}' > "${{ matrix.asset }}.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
